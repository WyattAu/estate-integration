[package]
name = "estate-integration"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Cross-crate dogfooding suite proving the WyattAu crate estate composes the way real users combine it"
repository = "https://github.com/WyattAu/estate-integration"
keywords = ["integration", "testing", "axum", "jwt", "email"]
categories = ["development-tools::testing"]
publish = false
exclude = ["target/"]

[dependencies]
# --- WyattAu estate crates -------------------------------------------------
# Pinned to exact published versions: these tests verify that the released
# artifacts interoperate, so every failure is attributable to a real drift
# between crates, not to a moving dependency.
salting = "=2.0.0"
tokenkit = { version = "=0.4.1", features = ["revocation", "rotation"] }
validkit = "=1.3.1"
barbican = "=0.2.1"
# 2.0.0 → 2.0.1 (round 3): test-only release over 2.0.0; current exact pin.
# NOTE: the `timeout` feature is deliberately OFF — see tests/outbox_dispatch.rs
# and the README findings: outbox-kit 0.1.0's dispatcher match on
# `CircuitBreakerError` has no `Timeout` arm, so enabling breaker's additive
# `timeout` feature anywhere in the graph breaks outbox-kit's build.
breaker = { version = "=2.0.1", features = ["tower"] }
healthkit = { version = "=1.3.1", features = ["axum"] }
throttle-kit = { version = "=2.0.0", features = ["in-memory", "tower"] }
otelkit = "=2.1.0"
mailkit = { version = "=0.3.1", features = ["resend", "sendgrid"] }
sieve-kit = "=0.2.1"
media-kit = "=0.2.1"
blobkit = { version = "=0.4.2", features = ["memory", "std", "serde"] }
cas-kit = { version = "=0.2.1", features = ["tokio"] }
mail-sync-kit = "=0.1.1"
eventbus-kit = { version = "=0.3.5", features = ["sqlite"] }
resilient-fetch = { version = "=0.1.0", features = ["circuit-breaker", "json"] }
# NOTE: `retry-backoff` was pinned here from round 1 and never used by any
# suite. It resolves to bk-rs/retry-rs, a *third-party* crate (8.6k
# downloads) — not this account's `loop-retry` (published by the
# `retry-backoff` repo, which names itself differently). So the manifest
# claimed coverage of a crate the estate does not own, while the crate it
# does own went uncomposed. Dropped the phantom; loop-retry is exercised
# transitively through fetch-kit's retry feature and is a Round-6 target
# for a direct suite.
loop-retry = "=0.1.1"                          # round 6 (transitive via fetch-kit retry)

# --- round 3: dogfooding the 2026-09-16 kit wave -----------------------------
# Each pin names the suite that exercises it (tests/).
config-kit = "=0.1.1"                        # tests/config_secrets.rs
idempotency-kit = "=0.1.0"                   # tests/idempotent_webhook.rs (default: memory)
# outbox-kit 0.2.0 — the pin that used to be held at 0.1.0. ledger-kit
# 0.1.1 declares `outbox-kit = "^0.2"`, so one graph now holds a single
# major and the durable-journal suite runs on the current release. See the
# README round-6 finding for what the hold was and what released it.
outbox-kit = "=0.2.0"                        # tests/outbox_dispatch.rs (default: memory+dispatch)
percentile-kit = "=0.1.0"                    # tests/percentile_report.rs (default: tracker+report)
chaos-kit = "=0.1.1"                         # tests/chaos_resilience.rs (default: tower+tokio-test)
metrics-kit = "=0.2.0"                       # tests/metrics_scrape.rs
webhookkit = "=2.2.1"                        # tests/idempotent_webhook.rs

# --- round 4: dogfooding the 2026-09-25 wave -----------------------------
telemetry-init = "=0.1.1"                    # tests/telemetry_bootstrap.rs (default: metrics+json; `otlp` stays OFF — hermetic)
# NOTE: default-features = false. worker-kit's default `breaker` feature pins
# breaker with `features = ["timeout"]`, which unifies graph-wide and breaks
# outbox-kit 0.1.0's compile (`Dispatcher::process` has no `Timeout` arm —
# E0004, verified). Same regression class as the round-3 finding; see the
# README integration findings for the details and the ask.
worker-kit = { version = "=0.3.0", default-features = false, features = ["leader"]  } # tests/worker_supervisor_drain.rs (`leader` pulls only async-trait — no redis)
shutdown-kit = "=0.3.2"                      # tests/worker_supervisor_drain.rs (ShutdownGuard)

# --- round 5: estate-integration composition round ---------------------------
clock-kit = { version = "=0.1.0", features = ["tsc"] }  # tests/clock_precision.rs, tests/hw_pinned_hotpath.rs (`tsc`: hardware-counter reads behind calibration)
book-kit = "=0.1.0"                          # tests/book_feed.rs
wire-kit = "=0.1.0"                          # tests/book_feed.rs
hw-kit = { version = "=0.1.0", features = ["libc"] }    # tests/hw_pinned_hotpath.rs (`libc`: sched_setaffinity pinning)
uring-kit = "=0.1.0"                         # tests/uring_proxy.rs
ledger-kit = "=0.1.1"                        # tests/ledger_settlement.rs (default: audit+outbox), tests/money_stack.rs

# --- round 6: the accounting core -------------------------------------------
# decimal-money is ledger-kit's own money type (re-exported as
# `MonetaryAmount`), and billing-kit re-exports the same crate — so these
# three pins are one type in three places, which is the point the suite
# asserts rather than assumes.
double-entry = "=0.1.0"                    # tests/accounting_core.rs (the accounting core)
decimal-money = "=1.1.1"                      # tests/money_stack.rs
# 0.2.0 (published 2026-10-05 by this loop): realigns decimal-money from
# ^0.2 to ^1, which is the version ledger-kit uses. Until this release the
# graph held two majors of the estate's money crate and `Price::gross()`
# could not be handed to `Ledger::post` — see the README round-7 finding.
billing-kit = "=0.2.0"                        # tests/money_stack.rs (default: serde)
sheet-engine = "=0.1.0"                       # tests/money_stack.rs (formula-driven report), tests/spreadsheet_engine.rs (engine + recalc)
sheet-core = "=0.1.0"                         # tests/money_stack.rs (cell vocabulary)
formula-lang = "=0.1.1"                       # tests/money_stack.rs (Value), tests/spreadsheet_engine.rs (is_volatile predicate)
rust_decimal = "1"                            # tests/money_stack.rs (dec! / Decimal)

# --- round 7: the provisioning + session stack ------------------------------
# accessctl, scim-kit, tamper-audit, ws-kit and ws-barbican had no composed
# suite until now; together with barbican/tokenkit they form the multi-tenant
# auth story the accounting product needs on day one.
accessctl = { version = "=0.1.0", features = ["cedar"] }  # tests/auth_provision.rs (hardcoded + Cedar agreement)
scim-kit = "=0.1.0"                         # tests/auth_provision.rs (RFC 7644 shape, filters, paging)
tamper-audit = "=0.2.0"                     # tests/auth_provision.rs (hash-linked audit chain)
ws-kit = "=0.4.2"                           # tests/auth_provision.rs (typed WS transport)
ws-barbican = "=0.1.2"                      # tests/auth_provision.rs (token from header/query/cookie)

# --- round 9: collaborative documents + publication -----------------------
# Five crates that had no composed suite. The centre of gravity is
# convergence under varying delivery order, which no per-crate test can see.
crdts-kit = "=0.1.0"                       # tests/collab_docs.rs (RGA convergence, presence)
i18n-kit = "=0.1.3"                        # tests/collab_docs.rs (fallback chains, pluralization)
# NOTE: eventbus-kit is the *package* name published from the `eventbus` repo;
# the pin above already carries it, so no second dependency is needed here.
docs-pipeline = "=0.1.4"                   # tests/collab_docs.rs (render + sanitisation boundary)

# --- round 10: the single-binary service substrate ------------------------
# Four crates that everything else in the estate assumes compose, and that
# had no composed suite until now.
actor-kit = "=0.2.5"                      # tests/systems_substrate.rs (work-stealing actors)
slab-pool = "=0.1.0"                      # tests/systems_substrate.rs (borrow-checked pool guards)
shared-state = "=0.1.2"                   # tests/systems_substrate.rs (TTL cache, readiness gate)
shm-rings = "=0.2.1"                      # tests/systems_substrate.rs (SPMC shared-memory ring)

# --- round 11: the API surface layer ---------------------------------------
# Seven crates every service returns from a handler, and that had never been
# composed with each other. The spine is one error travelling every hop:
# enum -> code -> status -> recovery class -> envelope -> pagination.
error-codes = "=1.1.0"                     # tests/api_errors.rs (codes, ProblemDetail, HttpError)
error-classify = "=0.3.1"                 # tests/api_errors.rs (AppError trait)
http-errors = "=0.1.0"                    # tests/api_errors.rs (status + problem derive)
typed-id-new = "=0.1.0"                   # tests/api_errors.rs (UUIDv7 newtypes)
typed-id-derive = "=0.1.0"                 # tests/api_errors.rs (the TypedId derive)
api-types = "=0.1.1"                      # tests/api_errors.rs (ApiResponse, PaginationMeta)
api-paginate = "=0.1.1"                   # tests/api_errors.rs (offset + cursor pagination)
json-envelope = "=0.1.0"                  # tests/api_errors.rs (the parallel envelope)
uuid = { version = "1", features = ["v7", "serde"] }  # tests/api_errors.rs (typed ids wrap UUIDv7)

# --- round 12: the operational shell ---------------------------------------
# Four crates every binary sets up at startup: feature flags, process
# ownership, the telemetry facade, and layered configuration.
# `chrono` gates `FlagChange::now`; without it a change record has to be
# built with an explicit timestamp, so the suite takes the feature to pin the
# clock-stamping path.
flag-kit = { version = "=0.7.0", features = ["chrono"] }  # tests/flags_and_lifecycle.rs (deterministic rollout; `chrono` gates FlagChange::now)
pid-manager = "=0.1.0"                   # tests/flags_and_lifecycle.rs (lock ownership + staleness)
otel-stack = "=0.2.0"                    # tests/flags_and_lifecycle.rs (telemetry facade defaults)
envstack = "=0.2.1"                      # tests/flags_and_lifecycle.rs (layer precedence)

# --- round 13: the authentication stack -------------------------------------
# Four Tier A security crates. Every primitive here is checked against a
# published vector (RFC 4231, RFC 7636, RFC 4648) or against the *other*
# crate, never against itself.
cryptkit = "=0.1.0"                      # tests/crypto_auth.rs (HMAC vs RFC 4231, constant-time eq)
webauthn-kit = "=0.3.7"                  # tests/crypto_auth.rs (challenges, base64url, sign counts)
oauth-toolkit = "=0.3.0"                 # tests/crypto_auth.rs (PKCE vs RFC 7636, CSRF store)
multi-chain-wallet = "=0.3.0"            # tests/crypto_auth.rs (key derivation)
rust_decimal_macros = "1"                     # tests/money_stack.rs (dec!)
policy-kit = "=0.1.0"                        # tests/policy_gateway.rs (default: json)
fetch-kit = "=0.2.0"                         # tests/policy_gateway.rs (default: json+rustls-tls+retry — hermetic)
# tests/policy_gateway.rs: fetch-kit 0.2.0's native middleware stack is
# built on reqwest 0.13, while the workspace's other reqwest consumers
# (axum-stack-era suites, wiremock hosts) stay on 0.12 — the two majors
# coexist in this graph and do NOT unify. The suite implements
# `fetch_kit::middleware::Middleware`, so it must name reqwest 0.13's
# types; the rename keeps the two versions legible at the use sites.
# (README round-5 finding.)
reqwest-edge = { package = "reqwest", version = "=0.13", default-features = false }
http = "1"                                   # `http::Extensions` in fetch-kit's Middleware trait

# --- round 6: the product-phase substrate wave -----------------------------
# The automotive calibration pipeline: A2L description + DBC bit layout +
# CAN wire + XCP protocol, composed in tests/calibration_stack.rs.
a2l-parse = "=0.1.0"                         # tests/calibration_stack.rs (no_std, zero deps)
dbc-parse = "=0.1.0"                         # tests/calibration_stack.rs (no_std, zero deps)
can-core = "=0.1.0"                          # tests/calibration_stack.rs (no_std; thiserror)
xcp-core = "=0.1.0"                          # tests/calibration_stack.rs (no_std; can-core + thiserror)
# The L2 calibration layer over the four substrate crates above.
# It re-exports a2l-parse/dbc-parse/xcp-core, so the suite can cross-check
# the layer's answers against the substrates through one dependency.
cal-model = "=0.1.1"                         # tests/cal_model_session.rs, tests/round16_debt.rs
# The spectral analysis/restoration layer over dsp-core.
dsp-spectral = "=0.1.0"                     # tests/dsp_spectral_restore.rs, tests/round16_debt.rs (no_std; dsp-core + thiserror)
# The font toolchain's write path: an editable outline model and a CPU
# rasterizer/shaper, layered over font-parse.
font-model = "=0.1.0"                      # tests/font_pipeline.rs (L1 model)
font-shape = "=0.1.0"                      # tests/font_pipeline.rs (L2 raster/shape)

# --- plumbing ---------------------------------------------------------------
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = "0.4"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cache-pal = "=0.4.0"                      # tests/round16_debt.rs (TTL cache beside shared-state and shm-rings)
chronoshift = "=1.0.1"                    # tests/round16_debt.rs (superseded time source, beside clock-kit)

[dev-dependencies]
wiremock = "0.6"
# tests/api_errors.rs: a service error type to drive the derive, and the
# `TypedId` derive's `#[serde(transparent)]` attribute needs serde in scope.
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
# tests/idempotent_webhook.rs: locally compute the HMAC-SHA256 signatures
# webhookkit then verifies (the same crates webhookkit 2.0.0 builds on).
hmac = "0.12"
sha2 = "0.10"
# tests/config_secrets.rs: builds the `overrides` layer values
# (BTreeMap<String, toml::Value>) config-kit's ConfigLayer::overrides takes.
# Same major as config-kit 0.1.0's own toml, so the graphs unify.
toml = "1"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
